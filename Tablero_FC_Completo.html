<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flujo de Caja — Real vs Plan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --navy:#0E3552; --navy-deep:#081F30; --steel:#3D6A88; --slate:#7488A0; --mist:#C7D2DA; --paper:#F5F7F9;
    --card:#FFFFFF; --ink:#16242F; --ink-soft:#5C7284; --line:#E2E8EC;
    --gold:#A9852E; --amber:#C9862E; --red:#B23A2E; --green:#2E7D5B;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --sans:'Montserrat', -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;}
  header{background:linear-gradient(135deg,var(--navy-deep),var(--navy) 60%,var(--steel));color:#fff;padding:10px 20px 8px;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;display:flex;align-items:center;gap:8px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#8ee6a8;box-shadow:0 0 8px #8ee6a8;}
  .dot.loading{background:#f5c26b;box-shadow:0 0 8px #f5c26b;animation:pulse 1s infinite;}
  .dot.error{background:#e57373;box-shadow:0 0 8px #e57373;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{margin:2px 0 0;font-size:17px;font-weight:800;}
  #statusMsg{font-size:10.5px;opacity:.85;margin-top:3px;}
  .filtros{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line);}
  .filtros label{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .filtros select,.filtros input{font-family:var(--sans);font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy);font-weight:600;}
  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:7px 12px;font-weight:700;font-family:var(--sans);font-size:12px;cursor:pointer;}
  .btn.sec{background:#fff;color:var(--navy);}
  .btn:disabled{opacity:.5;cursor:wait;}
  nav{display:flex;gap:0;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  nav button{border:none;background:none;padding:11px 13px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;}
  nav button.active{color:var(--navy);border-bottom-color:var(--amber);}
  main{padding:14px 20px 40px;}
  .vista{display:none;} .vista.activa{display:block;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px;}
  .kpi{background:#fff;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:8px;padding:8px 10px;}
  .kpi.ok{border-left-color:var(--green);} .kpi.ok .val{color:var(--green);}
  .kpi.warn{border-left-color:var(--amber);} .kpi.warn .val{color:var(--amber);}
  .kpi.bad{border-left-color:var(--red);} .kpi.bad .val{color:var(--red);}
  .kpi .lab{font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.035em;font-weight:700;}
  .kpi .val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--navy);margin-top:4px;}
  .kpi .sub{font-size:10px;color:var(--ink-soft);margin-top:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
  .card h3{margin:0 0 4px;font-size:13px;color:var(--navy);}
  .card .nota{font-size:11px;color:var(--ink-soft);margin:0 0 8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr;}}
  .chartbox{position:relative;height:300px;}
  .tabla-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;}
  table.t{border-collapse:separate;border-spacing:0;font-size:11.5px;width:max-content;min-width:100%;}
  table.t th,table.t td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.t thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:700;z-index:2;text-align:right;}
  table.t thead tr:nth-child(2) th{top:24px;background:var(--steel);font-weight:600;font-size:10.5px;}
  table.t th:first-child,table.t td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:260px;}
  table.t thead th:first-child{background:var(--navy);z-index:3;}
  /* la 2.ª fila del encabezado no tiene columna "Concepto" (rowspan): su primera celda es "Real" del primer mes, no debe ser ancha ni fija a la izquierda */
  table.t thead tr:nth-child(2) th:first-child{left:auto;min-width:0;text-align:right;background:var(--steel);z-index:2;}
  td.sem-verde{background:#e6f4ea !important;} td.sem-ambar{background:#fef7e0 !important;} td.sem-rojo{background:#fce8e6 !important;}
  tr.tot td.sem-verde,tr.tot td.sem-ambar,tr.tot td.sem-rojo{background:var(--navy) !important;}
  .sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .sd.verde{background:#1e8e3e;} .sd.ambar{background:#e8a33d;} .sd.rojo{background:#c5221f;}
  .leyenda{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-soft);margin:0 0 8px;flex-wrap:wrap;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 10px;}
  .seg button{border:none;background:#fff;padding:6px 12px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}
  table.t td.n{text-align:right;font-family:var(--mono);}
  table.t td.neg{color:var(--red);}
  table.t tr.sec td{background:#e8eef5;font-weight:700;color:var(--navy);}
  table.t tr.sub td{background:#fbf6e9;font-weight:700;}
  table.t tr.tot td{background:var(--navy);color:#fff;font-weight:800;}
  table.t tr.tot td.neg{color:#ffb4ab;}
  table.t tr.sal td{background:#e6f2ea;font-weight:700;}
  table.t tr.sec td:first-child{background:#e8eef5;} table.t tr.sub td:first-child{background:#fbf6e9;}
  table.t tr.tot td:first-child{background:var(--navy);} table.t tr.sal td:first-child{background:#e6f2ea;}
  table.t td.ind{padding-left:22px;}
  table.t td.sep{border-left:2px solid var(--mist);}
  .chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:10.5px;font-weight:700;}
  .chip.ok{background:#e1f2e9;color:var(--green);} .chip.warn{background:#fbefdc;color:var(--amber);} .chip.bad{background:#f8e1de;color:var(--red);} .chip.neu{background:#eef1f4;color:var(--slate);}
  .aviso{background:#fff8e6;border:1px solid #f0d9a6;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;}
  .aviso.err{background:#fdecea;border-color:#f3c1bb;}
  .cargar{max-width:760px;margin:30px auto;}
  .muted{color:var(--ink-soft);}
  .checks{display:flex;gap:10px;align-items:center;font-size:11.5px;margin:0 0 8px;flex-wrap:wrap;}
  .checks label{display:flex;gap:4px;align-items:center;font-weight:600;color:var(--ink);}
</style>
</head>
<body>
<header>
  <div class="eyebrow"><span id="dot" class="dot loading"></span>Imporinox · Flujo de caja completo</div>
  <h1>Flujo de Caja — Real vs Forecast vs Presupuesto</h1>
  <div id="statusMsg">Cargando…</div>
</header>

<div class="filtros" id="filtros" style="display:none">
  <label>Desde<select id="fDesde"></select></label>
  <label>Hasta<select id="fHasta"></select></label>
  <label>Comparar real contra<select id="fModo"></select></label>
  <label>Nivel<select id="fNivel"><option value="rubro">Rubro</option><option value="grupo">Grupo (entradas/salidas por sección)</option></select></label>
  <label>Materialidad desvíos (M COP)<input id="fMat" type="number" value="100" min="0" step="50" style="width:110px"></label>
  <div style="flex:1"></div>
  <button class="btn sec" id="btnRecargar" title="Volver a leer el Sheet">↻ Actualizar datos</button>
  <button class="btn" id="btnExcel">⬇ Descargar Excel</button>
</div>
<nav id="nav" style="display:none">
  <button data-v="resumen" class="active">Resumen</button>
  <button data-v="tabla">Tabla FC</button>
  <button data-v="cascada">Cascada</button>
  <button data-v="asert">Asertividad</button>
  <button data-v="desvios">Desvíos</button>
  <button data-v="caja">Caja proyectada</button>
  <button data-v="datos">Datos y cuadre</button>
</nav>
<main>
  <div id="cargar" class="cargar" style="display:none"></div>
  <section class="vista activa" id="v-resumen"></section>
  <section class="vista" id="v-tabla"></section>
  <section class="vista" id="v-cascada"></section>
  <section class="vista" id="v-asert"></section>
  <section class="vista" id="v-desvios"></section>
  <section class="vista" id="v-caja"></section>
  <section class="vista" id="v-datos"></section>
</main>

<script>
/* ======================================================================
   CONFIGURACIÓN — Sheet BD_FC_ABASTECIMIENTO (publicado en la web)
   Para cada hoja: abrirla en el Sheet, copiar el número que aparece en la
   URL después de "#gid=" y pegarlo aquí.
   ====================================================================== */
const CONFIG = {
  PUB_KEY: '2PACX-1vRCheKxYPEjZIHuzhFRMUMwrTqfr520EL7x47CNC5VgVtzqraMyHILPctfwRCbJcShV97etvscM9MX0',
  GID_DATOS: '976676293',    // hoja FCC_DATOS
  GID_SALDOS: '1454376095',   // hoja FCC_SALDOS
  GID_RUBROS: '386047465'    // hoja FCC_RUBROS
};
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
/*__DEMO__*/

// ============================== UTILIDADES ==============================
const $ = id => document.getElementById(id);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mesTxt = m => MESES[+m.slice(5,7)-1] + '-' + m.slice(2,4);
function mesAdd(m, k){ let a=+m.slice(0,4), n=+m.slice(5,7)+k; while(n<1){n+=12;a--;} while(n>12){n-=12;a++;} return a+'-'+String(n).padStart(2,'0'); }
function parseNum(v){
  if (v==null || v==='') return 0;
  if (typeof v==='number') return v;
  let s=String(v).trim().replace(/\$|\s/g,''); if(!s||s==='-') return 0;
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.');       // 1.234.567,89
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');                 // 1,234,567.89
  else if (/^-?\d+,\d+$/.test(s)) s=s.replace(',','.');                                    // 1234,5
  const n=parseFloat(s); return isFinite(n)?(neg?-n:n):0;
}
const M = v => v/1e6;
function fmt(v, dec=0){ if(v===''||v==null||!isFinite(v)) return '—'; let x=v/1e6; if(Math.abs(x)<0.5*Math.pow(10,-dec)) x=0; return x.toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtPct(v){ if(v==null||!isFinite(v)) return '—'; return (v*100).toLocaleString('es-CO',{maximumFractionDigits:1})+'%'; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function td(v, cls=''){ const neg = typeof v==='number' && v <= -5e5; return `<td class="n ${cls} ${neg?'neg':''}">${typeof v==='number'?fmt(v):v}</td>`; }
/** Semáforo de desvío (misma regla del Sheet): verde si |real−plan| < materialidad o ≤ 10% del plan; ámbar 10–25%; rojo > 25%. */
function semaforo(r, p, mat){
  if (r==null || p==null) return '';
  const d=Math.abs(r-p); if (d < mat) return 'verde';
  const b=Math.abs(p); if(!b) return 'rojo';
  const x=d/b; return x<=0.10?'verde':x<=0.25?'ambar':'rojo';
}
const SEM_HEX = {verde:'#1e8e3e', ambar:'#e8a33d', rojo:'#c5221f'};
const leyendaSem = mat => `<div class="leyenda">Semáforo del desvío (Real − Plan): <span><span class="sd verde"></span>verde ≤ 10% del plan o menor a ${fmt(mat)} M</span><span><span class="sd ambar"></span>ámbar 10–25%</span><span><span class="sd rojo"></span>rojo &gt; 25%</span><span>· la materialidad se cambia arriba</span></div>`;
function chipAsert(a){ if(a==null) return '<span class="chip neu">—</span>'; const c=a>=0.9?'ok':a>=0.75?'warn':'bad'; return `<span class="chip ${c}">${fmtPct(a)}</span>`; }

// ============================== CARGA DE DATOS ==============================
const csvUrl = gid => `https://docs.google.com/spreadsheets/d/e/${CONFIG.PUB_KEY}/pub?gid=${gid}&single=true&output=csv`;
async function fetchCsv(gid){
  const url = csvUrl(gid) + '&t=' + Date.now();
  try { const r = await fetch(url); if(!r.ok) throw 0; return await r.text(); }
  catch(e){ const r2 = await fetch(CORS_PROXY + encodeURIComponent(url)); if(!r2.ok) throw new Error('No se pudo leer gid '+gid); return await r2.text(); }
}
const parseCsv = txt => Papa.parse(txt, {skipEmptyLines:true}).data;

let DB = null, charts = {};
async function cargar(){
  $('dot').className='dot loading'; $('statusMsg').textContent='Cargando datos…';
  try{
    let raw;
    if (window.FCC_DEMO) raw = window.FCC_DEMO;
    else if (CONFIG.GID_DATOS && CONFIG.GID_SALDOS && CONFIG.GID_RUBROS){
      const [d,s,r] = await Promise.all([fetchCsv(CONFIG.GID_DATOS), fetchCsv(CONFIG.GID_SALDOS), fetchCsv(CONFIG.GID_RUBROS)]);
      raw = {datos:parseCsv(d), saldos:parseCsv(s), rubros:parseCsv(r)};
    } else if (window.__CARGADOS__) raw = window.__CARGADOS__;
    else { pantallaCargar(); return; }
    DB = construirDB(raw);
    $('cargar').style.display='none'; $('filtros').style.display='flex'; $('nav').style.display='flex';
    prepararFiltros();
    $('dot').className='dot';
    $('statusMsg').textContent = `${DB.mesesReal.length} meses de real (${mesTxt(DB.mesesReal[0])} a ${mesTxt(DB.mesesReal[DB.mesesReal.length-1])}) · ${DB.versiones.filter(v=>v.tipo==='FCST').length} versiones de forecast · ${DB.versiones.filter(v=>v.tipo==='PPTO').length} presupuestos · Cifras en millones de COP · entradas +, salidas − · actualizado ${new Date().toLocaleString('es-CO')}` + (window.FCC_DEMO?' · DATOS DE DEMOSTRACIÓN':'');
    render();
  } catch(e){
    console.error(e); $('dot').className='dot error'; $('statusMsg').textContent='Error al cargar: '+e.message;
    pantallaCargar(e.message);
  }
}
function pantallaCargar(err){
  $('cargar').style.display='block';
  $('cargar').innerHTML = `<div class="card">${err?`<div class="aviso err">${esc(err)}</div>`:''}
    <h3>Conectar los datos</h3>
    <p class="nota">Opción A (permanente): en el código, sección CONFIG, pon el número <b>gid</b> de las hojas FCC_DATOS, FCC_SALDOS y FCC_RUBROS del Sheet publicado.</p>
    <p class="nota">Opción B (rápida): en el Sheet, abre cada hoja → Archivo → Descargar → CSV, y sube aquí los 3 archivos.</p>
    <input type="file" id="archivos" multiple accept=".csv,text/csv"></div>`;
  $('statusMsg').textContent='Faltan los datos';
  $('archivos').onchange = async ev => {
    const out = {};
    for (const f of ev.target.files){
      const rows = parseCsv(await f.text()); const h = (rows[0]||[]).join('|');
      if (/Versi/.test(h) && /Rubro/.test(h)) out.datos = rows;
      else if (/Saldo inicial/.test(h)) out.saldos = rows;
      else if (/Orden/.test(h) && /Rubro/.test(h)) out.rubros = rows;
    }
    if (out.datos && out.saldos && out.rubros){ window.__CARGADOS__ = out; cargar(); }
    else alert('Faltan archivos: necesito FCC_DATOS, FCC_SALDOS y FCC_RUBROS.');
  };
}

function construirDB(raw){
  const db = {cat:[], catIdx:{}, real:{}, realOrigen:{}, ver:{}, verSaldo:{}, versiones:[], saldos:[], filas:[]};
  // catálogo
  (raw.rubros||[]).slice(1).forEach(r=>{
    if(!r[3]) return;
    const c = {orden:parseNum(r[0]), seccion:r[1], flujo:r[2], rubro:String(r[3]).trim(), esCaja:String(r[4]).toUpperCase()!=='NO'};
    if (!db.catIdx[c.rubro]){ db.cat.push(c); db.catIdx[c.rubro]=c; }
  });
  const verMeta = {};
  (raw.datos||[]).slice(1).forEach(r=>{
    const tipo=String(r[0]).trim(), version=String(r[1]).trim(), mes=String(r[3]).trim().slice(0,7), seccion=String(r[4]).trim(), rubro=String(r[6]).trim(), valor=parseNum(r[7]), origen=String(r[8]||'');
    if(!tipo||!/^\d{4}-\d{2}$/.test(mes)) return;
    db.filas.push({tipo,version,fecha:r[2],mes,seccion,flujo:r[5],rubro,valor,origen});
    if (seccion==='Saldo'){ ((db.verSaldo[version]=db.verSaldo[version]||{})[mes]=db.verSaldo[version][mes]||{})[rubro]=valor; }
    else if (tipo==='REAL'){
      (db.real[mes]=db.real[mes]||{})[rubro]=(db.real[mes][rubro]||0)+valor;
      (db.realOrigen[mes]=db.realOrigen[mes]||{})[origen]=true;
      if(!db.catIdx[rubro]){ const c={orden:999,seccion:seccion||'Operación',flujo:r[5]||'Salida',rubro,esCaja:true}; db.cat.push(c); db.catIdx[rubro]=c; }
    } else {
      ((db.ver[version]=db.ver[version]||{})[mes]=db.ver[version][mes]||{})[rubro]=(db.ver[version][mes][rubro]||0)+valor;
      if(!db.catIdx[rubro]){ const c={orden:999,seccion:seccion||'Operación',flujo:r[5]||'Salida',rubro,esCaja:true}; db.cat.push(c); db.catIdx[rubro]=c; }
    }
    if (tipo!=='REAL'){ const vm = verMeta[version] = verMeta[version] || {tipo,version,meses:{},fecha:'',origen}; vm.meses[mes]=true; if(String(r[2])>vm.fecha) vm.fecha=String(r[2]); }
  });
  db.cat.sort((a,b)=>a.orden-b.orden);
  db.versiones = Object.values(verMeta).map(v=>({...v, meses:Object.keys(v.meses).sort()})).sort((a,b)=>a.version.localeCompare(b.version));
  db.mesesReal = Object.keys(db.real).sort();
  db.todosMeses = [...new Set([...db.mesesReal, ...db.versiones.flatMap(v=>v.meses)])].sort();
  (raw.saldos||[]).slice(1).forEach(r=>{
    const mes=String(r[0]).trim().slice(0,7); if(!/^\d{4}-\d{2}$/.test(mes)) return;
    const bancos = r[4]===''||r[4]==null ? null : parseNum(r[4]);
    db.saldos.push({mes, ini:parseNum(r[1]), flujo:parseNum(r[2]), finCalc:parseNum(r[3]), bancos, dif:r[5]===''?null:parseNum(r[5]), estado:r[6]||'', origen:r[7]||''});
  });
  db.saldoReal = {}; db.saldos.forEach(s=>db.saldoReal[s.mes]=s);
  return db;
}

// ============================== LÓGICA DE COMPARACIÓN ==============================
function prepararFiltros(){
  const opts = DB.todosMeses.map(m=>`<option value="${m}">${mesTxt(m)}</option>`).join('');
  $('fDesde').innerHTML = opts; $('fHasta').innerHTML = opts;
  const mr = DB.mesesReal;
  $('fDesde').value = mr[0] || DB.todosMeses[0];
  $('fHasta').value = mr[mr.length-1] || DB.todosMeses[DB.todosMeses.length-1];
  const fc = DB.versiones.filter(v=>v.tipo==='FCST'), pp = DB.versiones.filter(v=>v.tipo==='PPTO');
  $('fModo').innerHTML =
    `<optgroup label="Forecast móvil"><option value="lag0">Forecast hecho al inicio de cada mes</option>
      <option value="lag1">Forecast hecho 1 mes antes</option><option value="lag2">Forecast hecho 2 meses antes</option><option value="lag3">Forecast hecho 3 meses antes</option></optgroup>` +
    `<optgroup label="Presupuesto anual"><option value="ppto">Presupuesto del año (PPTO)</option></optgroup>` +
    (fc.length||pp.length ? `<optgroup label="Una versión fija">${[...pp,...fc].map(v=>`<option value="ver:${esc(v.version)}">${esc(v.version)}</option>`).join('')}</optgroup>` : '');
  ['fDesde','fHasta','fModo','fNivel','fMat'].forEach(id=>$(id).onchange = render);
}
const F = () => ({desde:$('fDesde').value, hasta:$('fHasta').value, modo:$('fModo').value, nivel:$('fNivel').value, mat:parseNum($('fMat').value)*1e6});
function versionPlan(mes, modo){
  if (modo.startsWith('lag')){ const k=+modo.slice(3); const v='FCST-'+mesAdd(mes,-k); return DB.ver[v] && DB.ver[v][mes] ? v : null; }
  if (modo==='ppto'){ const v='PPTO-'+mes.slice(0,4); return DB.ver[v] && DB.ver[v][mes] ? v : null; }
  if (modo.startsWith('ver:')){ const v=modo.slice(4); return DB.ver[v] && DB.ver[v][mes] ? v : null; }
  return null;
}
function nombreModo(modo){
  return {lag0:'forecast del inicio de mes', lag1:'forecast de 1 mes antes', lag2:'forecast de 2 meses antes', lag3:'forecast de 3 meses antes', ppto:'presupuesto anual'}[modo] || modo.slice(4);
}
function grupoDe(c){ return (c.flujo==='Entrada'?'Entradas':'Salidas')+' de '+String(c.seccion).toLowerCase(); }
function claveDe(rubro, nivel){ const c=DB.catIdx[rubro]; return nivel==='grupo' ? grupoDe(c) : rubro; }
function agrupar(mapa, nivel){ const o={}; if(!mapa) return null; for (const r in mapa){ if(!DB.catIdx[r]) continue; const k=claveDe(r,nivel); o[k]=(o[k]||0)+mapa[r]; } return o; }
function mesesRango(f){ return DB.todosMeses.filter(m=>m>=f.desde && m<=f.hasta); }
/** Estructura de filas (claves ordenadas por sección) para un nivel */
function estructura(nivel){
  const secs = ['Operación','Financiación','Inversión'], out=[];
  secs.forEach(s=>{
    const ent=[], sal=[];
    DB.cat.filter(c=>c.seccion===s).forEach(c=>{ const k=claveDe(c.rubro,nivel); const arr=c.flujo==='Entrada'?ent:sal; if(!arr.includes(k)) arr.push(k); });
    if (nivel==='rubro' && s==='Operación' && !ent.includes(R_JUNTO)) ent.unshift(R_JUNTO);
    out.push({seccion:s, ent, sal});
  });
  return out;
}
/** Ene–ago 2026 se migraron con "Recaudo total" (sin apertura contado/cartera). Si en un mes un lado trae el total
 *  y el otro la apertura, se comparan los dos agregados en "Recaudo (contado + cartera)" para no inventar desvíos. */
const R_TOTAL='Recaudo total (histórico sin apertura)', R_PARTES=['Recaudo de contado','Recaudo de cartera'], R_JUNTO='Recaudo (contado + cartera)';
function unirRecaudo(o){ if(!o) return o; const x={...o}; let t=0, hay=false; [R_TOTAL,...R_PARTES,R_JUNTO].forEach(k=>{ if(k in x){ t+=x[k]; hay=true; delete x[k]; } }); if(hay) x[R_JUNTO]=t; return x; }
/** Comparación por mes: {mes, version, real:{k}, plan:{k}|null} */
function comparar(f){
  return mesesRango(f).map(m=>{
    const v = versionPlan(m, f.modo);
    let real = agrupar(DB.real[m]||{}, f.nivel), plan = v ? agrupar(DB.ver[v][m], f.nivel) : null;
    if (f.nivel==='rubro' && plan && DB.real[m] && ((R_TOTAL in real) !== (R_TOTAL in plan))){ real = unirRecaudo(real); plan = unirRecaudo(plan); }
    return {mes:m, version:v, hayReal:!!DB.real[m], real, plan};
  });
}
function asertividad(pares){ // pares: [{r,p}]
  let sAbs=0, sR=0, sD=0;
  pares.forEach(x=>{ sAbs+=Math.abs(x.r-x.p); sR+=Math.abs(x.r); sD+=x.r-x.p; });
  if (!sR) return {a:null, sesgo:null, sAbs, sR};
  return {a:Math.max(0,1-sAbs/sR), sesgo:sD/sR, sAbs, sR};
}
function paresDe(comp){ const out=[]; comp.forEach(c=>{ if(!c.hayReal||!c.plan) return; const ks=new Set([...Object.keys(c.real),...Object.keys(c.plan)]); ks.forEach(k=>out.push({mes:c.mes,k,r:c.real[k]||0,p:c.plan[k]||0})); }); return out; }
const sumObj = o => o ? Object.values(o).reduce((a,b)=>a+b,0) : null;

let colsTabla = {r:true,p:true,d:true,pp:false,dpp:false};
const hayPpto = () => DB.versiones.some(v=>v.tipo==='PPTO');
function filasTabla(f, comp){
  const est = estructura(f.nivel), filas=[];
  const val = (src,k) => src ? (src[k]||0) : null;
  const sumK = (src, ks) => src ? ks.reduce((a,k)=>a+(src[k]||0),0) : null;
  const totSec=[];
  est.forEach(s=>{
    const ks=[...s.ent,...s.sal];
    if (!ks.some(k=>comp.some(c=>(c.real&&c.real[k])||(c.plan&&c.plan[k])))) return;
    filas.push({tipo:'sec', label:'ACTIVIDADES DE '+s.seccion.toUpperCase()});
    [['Entradas',s.ent],['Salidas',s.sal]].forEach(([lab,lista])=>{
      const vis = lista.filter(k=>comp.some(c=>(c.real&&c.real[k])||(c.plan&&c.plan[k])));
      if(!vis.length) return;
      if (f.nivel==='rubro') vis.forEach(k=>filas.push({tipo:'rub', label:k, get:(c,w)=> w==='r'?(c.hayReal?val(c.real,k):null):val(c.plan,k)}));
      filas.push({tipo:'sub', label:'Total '+lab.toLowerCase()+' de '+s.seccion.toLowerCase(), get:(c,w)=> w==='r'?(c.hayReal?sumK(c.real,vis):null):sumK(c.plan,vis)});

  const all = totSec.flat();
  filas.push({tipo:'tot', label:'FLUJO NETO', get:(c,w)=> w==='r'?(c.hayReal?sumK(c.real,all):null):sumK(c.plan,all)});
  filas.push({tipo:'sal', label:'Saldo final de caja', get:(c,w)=>{ if(w==='r'){const s=DB.saldoReal[c.mes]; return s?(s.bancos!=null?s.bancos:s.finCalc):null;} return c.version&&(DB.verSaldo[c.version]||{})[c.mes]?(DB.verSaldo[c.version][c.mes]['Saldo final']??null):null; }});
  return filas;
}
function vTabla(f){
  const comp = comparar(f), filas = filasTabla(f, comp);

  let h2 = `<tr>${comp.map(()=>cols.map((x,i)=>`<th class="${i===0?'sep':''}">${nomCol[x]}</th>`).join('')).join('')}<th class="sep">Real</th><th>Plan</th><th>Real−Plan</th><th>Var %</th><th>Asertividad</th></tr>`;
  const celda = (v, cls, sem) => { if (v==null) return `<td class="n ${cls}">—</td>`; const neg = v <= -5e5; return `<td class="n ${cls} ${neg?'neg':''} ${sem?'sem-'+sem:''}">${sem?`<span class="sd ${sem}"></span>`:''}${fmt(v)}</td>`; };
  const body = filas.map(fl=>{

    let tr=0,tp=0,sAbs=0,sR=0;

  $('v-tabla').innerHTML = `${avisoPpto}<div class="card"><h3>Flujo de caja: real vs ${esc(nombreModo(f.modo))}${pptoDisp&&(colsTabla.pp||colsTabla.dpp)?' y presupuesto anual':''}</h3>

    <div class="checks">Columnas por mes: ${['r','p','d','pp','dpp'].map(x=>`<label style="${(x==='pp'||x==='dpp')&&!pptoDisp?'opacity:.45':''}"><input type="checkbox" data-c="${x}" ${colsTabla[x]?'checked':''} ${(x==='pp'||x==='dpp')&&!pptoDisp?'disabled title="No hay presupuesto anual cargado"':''}>${nomCol[x]}${x==='pp'||x==='dpp'?' (anual)':''}</label>`).join('')}</div>
    <div class="tabla-wrap"><table class="t" id="tablaFC"><thead>${h1}${h2}</thead><tbody>${body}</tbody></table></div></div>`;

}

// ---------- CASCADA ----------
let modoCasc = 'real';
/** Claves en el orden del flujo de caja (operación: entradas, salidas; financiación; inversión). */
function ordenClaves(nivel){ return estructura(nivel).flatMap(s=>[...s.ent, ...s.sal]); }
/** Composición del flujo: saldo inicial → cada rubro → saldo final (real o plan). */
function datosComposicion(f, cual){
  const comp = comparar(f).filter(c=> cual==='real' ? c.hayReal : !!c.plan);
  const meses = comp.map(c=>c.mes);
  let tot = {}; comp.forEach(c=>{ const o = cual==='real'?c.real:c.plan; for(const k in o) tot[k]=(tot[k]||0)+o[k]; });
  if (f.nivel==='rubro' && Math.abs(tot[R_TOTAL]||0)>0.5 && [...R_PARTES,R_JUNTO].some(k=>Math.abs(tot[k]||0)>0.5))tot = unirRecaudo(tot);
  const orden = ordenClaves(f.nivel); Object.keys(tot).forEach(k=>{ if(!orden.includes(k)) orden.push(k); });
  const items = orden.filter(k=>Math.abs(tot[k]||0)>=5e5).map(k=>[k, tot[k]]);
  let ini = null;
  if (meses.length){
    const m0 = meses[0];
    if (cual==='real'){ const s0 = DB.saldoReal[m0]; ini = s0 ? s0.ini : null; }
    else { const v0 = comp[0].version; ini = ((DB.verSaldo[v0]||{})[m0]||{})['Saldo inicial'] ?? null; }
  }
  const flujo = items.reduce((a,x)=>a+x[1],0);
  return {meses, items, ini, flujo, fin: ini==null?null:ini+flujo, versiones:[...new Set(comp.map(c=>c.version).filter(Boolean))]};
}
/** Puente del plan al real: diferencia por rubro, en el orden del flujo, sin agrupar en "Otros". */
function datosCascada(f){
  const comp = comparar(f), pares = paresDe(comp);
  const meses = [...new Set(pares.map(p=>p.mes))];
  const hayTot = pares.some(p=>p.k===R_TOTAL), hayJ = pares.some(p=>p.k===R_JUNTO||R_PARTES.includes(p.k));
  const kk = k => f.nivel==='rubro' && hayTot && hayJ && (k===R_TOTAL||k===R_JUNTO||R_PARTES.includes(k)) ? R_JUNTO : k;   // recaudo con y sin apertura en el mismo rango → una sola barra
  const porK = {}, absK = {}; pares.forEach(p=>{ const k=kk(p.k); porK[k]=(porK[k]||0)+(p.r-p.p); absK[k]=(absK[k]||0)+Math.abs(p.r-p.p); });
  const P = pares.reduce((a,p)=>a+p.p,0), R = pares.reduce((a,p)=>a+p.r,0);
  const orden = ordenClaves(f.nivel); Object.keys(porK).forEach(k=>{ if(!orden.includes(k)) orden.push(k); });
  const top = orden.filter(k=>Math.abs(porK[k]||0)>0.5 || (absK[k]||0)>0.5).map(k=>[k, porK[k]||0, absK[k]||0]);

}

// ---------- DESVÍOS ----------
function datosDesvios(f){
  const comp = comparar({...f, hasta: DB.todosMeses[DB.todosMeses.length-1]}); // se necesitan meses posteriores para clasificar
  const enRango = new Set(mesesRango(f));
  const porMes = {}; comp.forEach(c=>{ if(c.hayReal&&c.plan) porMes[c.mes]=c; });
  const out=[];
  Object.values(porMes).forEach(c=>{
    if(!enRango.has(c.mes)) return;
    const ks=new Set([...Object.keys(c.real),...Object.keys(c.plan)]);
    ks.forEach(k=>{
      const d=(c.real[k]||0)-(c.plan[k]||0); if(Math.abs(d)<f.mat) return;
      const sig=[mesAdd(c.mes,1),mesAdd(c.mes,2)].map(m=>porMes[m]);
      let clase, acum=null;
      if (sig.every(Boolean)){ acum = d + sig.reduce((a,s)=>a+((s.real[k]||0)-(s.plan[k]||0)),0); clase = Math.abs(acum) <= 0.3*Math.abs(d) ? 'Desfase (se compensó)' : 'Permanente'; }
      else clase='Pendiente (faltan 2 meses para saber)';
      out.push({mes:c.mes,k,r:c.real[k]||0,p:c.plan[k]||0,d,acum,clase});
    });
  });
  return out.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
}
function vDesvios(f){
  const ds = datosDesvios(f);
  const res = {}; ds.forEach(x=>{ const o=res[x.k]=res[x.k]||{perm:0,desf:0,pend:0}; if(x.clase.startsWith('Perm')) o.perm+=x.d; else if(x.clase.startsWith('Desf')) o.desf+=x.d; else o.pend+=x.d; });
  const chipC = c => c.startsWith('Perm')?'bad':c.startsWith('Desf')?'warn':'neu';
  $('v-desvios').innerHTML = `

      <p class="nota"><b>Desfase</b>: el desvío del mes se compensó en los 2 meses siguientes (quedó ≤ 30% en el acumulado de 3 meses) → fue un tema de fecha, no de monto. <b>Permanente</b>: no se compensó → hay un cambio real de caja que optimizar o un supuesto que corregir. <b>Pendiente</b>: aún no hay 2 meses posteriores con real y plan.</p>

    <div class="card"><h3>Resumen por ${f.nivel==='rubro'?'rubro':'grupo'}</h3><div class="tabla-wrap"><table class="t"><thead><tr><th>${f.nivel==='rubro'?'Rubro':'Grupo'}</th><th>Permanente</th><th>Desfase</th><th>Pendiente</th></tr></thead><tbody>

    <div class="card"><h3>Real cargado y cuadre con bancos</h3><div class="tabla-wrap"><table class="t"><thead><tr><th>Mes</th><th>Origen</th><th>Saldo inicial</th><th>Flujo neto</th><th>Saldo final calc.</th><th>Saldo bancos</th><th>Diferencia</th><th>Estado</th></tr></thead><tbody>
      ${DB.saldos.map(s=>`<tr><td>${mesTxt(s.mes)}</td><td class="muted">${esc(Object.keys(DB.realOrigen[s.mes]||{}).join(' + '))}</td>${td(s.ini)}${td(s.flujo)}${td(s.finCalc)}${td(s.bancos==null?'—':s.bancos)}${td(s.dif==null?'—':s.dif)}<td><span class="chip ${/^Cuadra/.test(s.estado)?'ok':/NO/.test(s.estado)?'bad':'warn'}">${esc(s.estado||'—')}</span></td></tr>`).join('')}
    </tbody></table></div></div></div>
    <div class="card"><h3>Notas de método</h3><p class="nota">
      • Asertividad = 1 − Σ|real − plan| / Σ|real| (WAPE): los desvíos de distintos rubros no se compensan entre sí.<br>
      • "Forecast hecho al inicio de cada mes" compara cada mes contra la versión FCST-aaaa-mm de ese mismo mes; "1 mes antes" contra la del mes anterior, etc.<br>
      • Ene–ago 2026 se migraron de ejecucionfc sin apertura contado/cartera ("Recaudo total"). Cuando un mes tiene el total de un lado y la apertura del otro, se comparan juntos como "Recaudo (contado + cartera)".<br>
      • Todo viene de la hoja FCC_DATOS del Sheet BD_FC_ABASTECIMIENTO; este tablero no modifica datos.</p></div>`;
}

// ============================== EXPORTAR A EXCEL ==============================
async function exportar(){
  const btn=$('btnExcel'); btn.disabled=true; btn.textContent='Generando…';
  try{
    const f = F(), wb = new ExcelJS.Workbook(); wb.creator='Tablero FC Imporinox';
    const numFmt = '#,##0;[Red]-#,##0;"-"';
    const head = (ws, row, cols) => { const r=ws.addRow(row); r.font={bold:true,color:{argb:'FFFFFFFF'}}; r.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0E3552'}}; if(cols) ws.columns=cols; return r; };
    const info = `Rango ${mesTxt(f.desde)} a ${mesTxt(f.hasta)} · comparado contra ${nombreModo(f.modo)} · nivel ${f.nivel} · millones de COP · generado ${new Date().toLocaleString('es-CO')}`;
    // Tabla FC
    const comp = comparar(f), filas = filasTabla(f, comp);
    let ws = wb.addWorksheet('Tabla FC', {views:[{state:'frozen',xSplit:1,ySplit:3}]});
    ws.addRow(['Flujo de caja — real vs plan']).font={bold:true,size:14}; ws.addRow([info]).font={italic:true,size:9};
    head(ws, ['Concepto', ...comp.flatMap(c=>[mesTxt(c.mes)+' Real', mesTxt(c.mes)+' Plan', mesTxt(c.mes)+' Real−Plan'])]);
    filas.forEach(fl=>{
      if (fl.tipo==='sec'){ const r=ws.addRow([fl.label]); r.font={bold:true}; r.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8EEF5'}}; return; }
      const vals = comp.flatMap(c=>{ const r=fl.get(c,'r'), p=c.plan||fl.tipo==='sal'?fl.get(c,'p'):null; return [r==null?null:M(r), p==null?null:M(p), r!=null&&p!=null?M(r-p):null]; });
      const r = ws.addRow([fl.tipo==='rub'?'   '+fl.label:fl.label, ...vals]);
      if (fl.tipo!=='rub') r.font={bold:true};
      if (fl.tipo==='tot') r.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDE4EC'}};
      if (fl.tipo!=='sal') comp.forEach((c,i)=>{ const rr=fl.get(c,'r'), pp=c.plan?fl.get(c,'p'):null; if(!c.hayReal||rr==null||pp==null) return;
        const sm=semaforo(rr,pp,f.mat); if(sm) r.getCell(2+i*3+2).fill={type:'pattern',pattern:'solid',fgColor:{argb:{verde:'FFE6F4EA',ambar:'FFFEF7E0',rojo:'FFFCE8E6'}[sm]}}; });
    });
    ws.getColumn(1).width=42; for(let i=2;i<=1+comp.length*3;i++){ ws.getColumn(i).width=13; ws.getColumn(i).numFmt='#,##0;[Red]-#,##0'; }
    // Cascada
    const dc = datosCascada(f), dr = datosComposicion(f,'real'); ws = wb.addWorksheet('Cascada');
    ws.addRow(['Flujo real: saldo inicial → saldo final']).font={bold:true,size:13}; ws.addRow([info]).font={italic:true,size:9};
    head(ws,['Concepto','M COP']); ws.addRow(['Saldo inicial', dr.ini==null?null:M(dr.ini)]); dr.items.forEach(([k,v])=>ws.addRow([k,M(v)])); ws.addRow(['Saldo final',dr.fin==null?null:M(dr.fin)]).font={bold:true};
    ws.addRow([]); ws.addRow(['Del plan al real ('+dc.meses.map(mesTxt).join(', ')+')']).font={bold:true,size:13};
    head(ws,['Concepto','Real − Plan (M COP)','Σ |desvío| mes a mes']); ws.addRow(['Plan: flujo neto', M(dc.P)]); dc.top.forEach(([k,v,ab])=>ws.addRow([k,M(v),M(ab)])); ws.addRow(['Real: flujo neto',M(dc.R)]).font={bold:true};
    ws.getColumn(1).width=42; [2,3].forEach(i=>{ ws.getColumn(i).width=18; ws.getColumn(i).numFmt='#,##0;[Red]-#,##0'; });
    // Asertividad
    const pares = paresDe(comp), porK={}; pares.forEach(p=>(porK[p.k]=porK[p.k]||[]).push(p));
    ws = wb.addWorksheet('Asertividad'); ws.addRow(['Asertividad — '+nombreModo(f.modo)]).font={bold:true,size:13}; ws.addRow([info]).font={italic:true,size:9};
    head(ws,['Rubro/Grupo','Meses','Real','Plan','Real−Plan','Σ|Real−Plan|','Asertividad','Sesgo']);
    Object.entries(porK).map(([k,ps])=>({k,ps,...asertividad(ps)})).sort((a,b)=>b.sAbs-a.sAbs).forEach(x=>{
      const r=x.ps.reduce((a,p)=>a+p.r,0), p=x.ps.reduce((a,p2)=>a+p2.p,0);
      ws.addRow([x.k,new Set(x.ps.map(q=>q.mes)).size,M(r),M(p),M(r-p),M(x.sAbs),x.a,x.sesgo]); });
    const tt=asertividad(pares); ws.addRow(['TOTAL','', '', '', '', M(tt.sAbs), tt.a, tt.sesgo]).font={bold:true};
    ws.getColumn(1).width=40; [3,4,5,6].forEach(i=>ws.getColumn(i).numFmt='#,##0;[Red]-#,##0'); [7,8].forEach(i=>ws.getColumn(i).numFmt='0.0%');
    // Desvíos
    ws = wb.addWorksheet('Desvíos'); ws.addRow(['Desvíos materiales ≥ '+fmt(f.mat)+' M']).font={bold:true,size:13}; ws.addRow([info]).font={italic:true,size:9};
    head(ws,['Rubro/Grupo','Mes','Real','Plan','Real−Plan','Acumulado 3 meses','Clasificación']);
    datosDesvios(f).forEach(x=>ws.addRow([x.k,mesTxt(x.mes),M(x.r),M(x.p),M(x.d),x.acum==null?null:M(x.acum),x.clase]));
    ws.getColumn(1).width=40; ws.getColumn(7).width=34; [3,4,5,6].forEach(i=>ws.getColumn(i).numFmt='#,##0;[Red]-#,##0');
    // Datos filtrados
    ws = wb.addWorksheet('Datos'); head(ws,['Tipo','Versión','Mes','Sección','Flujo','Rubro','Valor COP','Origen']);
    DB.filas.filter(r=>r.mes>=f.desde&&r.mes<=f.hasta).forEach(r=>ws.addRow([r.tipo,r.version,r.mes,r.seccion,r.flujo,r.rubro,r.valor,r.origen]));
    ws.getColumn(6).width=36; ws.getColumn(7).width=18; ws.getColumn(7).numFmt='#,##0;[Red]-#,##0';
    // Gráficos: se renderiza cada vista para capturar sus gráficos
    const wsG = wb.addWorksheet('Gráficos'); let fila=1; const vistaPrev = vistaActiva;
    for (const v of ['resumen','cascada','asert','caja']){
      mostrar(v); await new Promise(r=>setTimeout(r,120));
      for (const cv of document.querySelectorAll('#v-'+v+' canvas')){
        const ch = charts[cv.id]; if(!ch) continue;
        const titulo = cv.closest('.card')?.querySelector('h3')?.textContent || cv.id;
        wsG.getCell('A'+fila).value = titulo; wsG.getCell('A'+fila).font={bold:true};
        const img = wb.addImage({base64: ch.toBase64Image('image/png',1), extension:'png'});
        wsG.addImage(img, {tl:{col:0,row:fila}, ext:{width:Math.min(cv.width,900), height:Math.min(cv.height,380)}});
        fila += 22;
      }
    }
    mostrar(vistaPrev);
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download = `FC_real_vs_plan_${f.desde}_a_${f.hasta}.xlsx`; document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ console.error(e); alert('No se pudo generar el Excel: '+e.message); }
  finally { btn.disabled=false; btn.textContent='⬇ Descargar Excel'; }
}
$('btnExcel').onclick = exportar;
$('btnRecargar').onclick = cargar;
if (window.Chart) Chart.defaults.font.family = "'Montserrat', sans-serif";
cargar();
</script>
